<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuarkForce — Specimen Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1410;
    --bg-raised: #101B15;
    --line: #263B2C;
    --acid: #B4FF39;
    --amber: #E8A23A;
    --paper: #EDEAE0;
    --paper-dim: #9FAE9A;
    --moss: #4A5D45;
    --danger: #FF6B4A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(180,255,57,0.06), transparent 60%),
      var(--bg);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
  }
  .stencil{ font-family:'Big Shoulders Stencil', sans-serif; letter-spacing:0.02em; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- HEADER ---------- */
  header{
    padding: 40px 24px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky; top:0; z-index:20;
    background: rgba(11,20,16,0.92);
    backdrop-filter: blur(6px);
  }
  .header-inner{ max-width: 1180px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; }
  .eyebrow{
    color: var(--acid); font-size:12px; text-transform:uppercase; letter-spacing:0.18em;
    font-family:'JetBrains Mono', monospace; margin-bottom:8px; display:block;
  }
  h1{
    font-family:'Big Shoulders Stencil', sans-serif;
    font-weight:800; font-size: clamp(34px, 6vw, 58px);
    margin:0; line-height:0.95; text-transform:uppercase;
    color: var(--paper);
  }
  h1 span{ color: var(--acid); }
  .progress-block{ text-align:right; min-width:180px; }
  .progress-count{ font-family:'JetBrains Mono', monospace; font-size:28px; color:var(--acid); }
  .progress-label{ font-size:11px; color:var(--paper-dim); text-transform:uppercase; letter-spacing:0.14em; margin-bottom:6px; }
  .progress-bar{ height:6px; width:180px; background:var(--line); margin-top:8px; position:relative; overflow:hidden; }
  .progress-bar i{ position:absolute; left:0; top:0; bottom:0; background:var(--acid); }

  /* ---------- GRID ---------- */
  main{ max-width:1180px; margin:0 auto; padding: 36px 24px 80px; }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card{
    border: 1px solid var(--line);
    background: var(--bg-raised);
    aspect-ratio: 3/4;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover, .card:focus-visible{ transform: translateY(-3px); border-color: var(--acid); outline:none; }
  .card .tag{
    position:absolute; top:0; left:0; padding:5px 9px;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background: var(--bg); color: var(--paper-dim); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    z-index:2;
  }
  .card.ready .tag{ color: var(--acid); }
  .card img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter: saturate(0.92);
  }
  .card .name-strip{
    position:absolute; left:0; right:0; bottom:0; padding:10px 10px 9px;
    background: linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
    z-index:2;
  }
  .card .name-strip .cat{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--acid); text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:2px;}
  .card .name-strip .nm{ font-family:'Big Shoulders Stencil', sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; line-height:1; }

  .card.locked{ cursor:default; }
  .card.locked:hover{ transform:none; border-color:var(--line); }
  .card.locked .placeholder{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 14px);
  }
  .placeholder .stamp{
    border: 1px solid var(--moss); color: var(--moss);
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em;
    padding: 5px 10px; transform: rotate(-6deg); text-transform:uppercase;
  }
  .placeholder .num{ font-family:'Big Shoulders Stencil', sans-serif; font-size:38px; color: var(--line); }

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,8,6,0.86);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--bg-raised); border:1px solid var(--line);
    max-width: 920px; width:100%; max-height:88vh; overflow-y:auto;
    display:grid; grid-template-columns: 1.1fr 1fr;
  }
  @media (max-width: 720px){ .modal{ grid-template-columns: 1fr; } }
  .modal-media{ background:#000; display:flex; align-items:center; justify-content:center; min-height:240px; }
  .modal-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-body{ padding: 28px 26px; position:relative; }
  .modal-close{
    position:absolute; top:14px; right:14px; background:none; border:1px solid var(--line);
    color:var(--paper); width:32px; height:32px; cursor:pointer; font-size:16px;
  }
  .modal-close:hover{ border-color:var(--acid); color:var(--acid); }
  .modal-cat{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--acid); text-transform:uppercase; letter-spacing:0.14em; }
  .modal-name{ font-family:'Big Shoulders Stencil', sans-serif; font-size:40px; text-transform:uppercase; line-height:0.95; margin: 6px 0 14px; }
  .modal-blurb{ color: var(--paper-dim); line-height:1.55; margin-bottom:20px; font-size:15px; }
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px 18px; border-top:1px solid var(--line); padding-top:16px; }
  .stat{ }
  .stat .k{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--moss); text-transform:uppercase; letter-spacing:0.1em; }
  .stat .v{ font-size:14px; margin-top:3px; }

  footer{ text-align:center; padding: 30px; color: var(--moss); font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <span class="eyebrow">QuarkForce Field Division</span>
      <h1>Specimen <span>Index</span></h1>
    </div>
    <div class="progress-block">
      <div class="progress-label">Catalogued</div>

    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>QUARKFORCE — MONSTER ISLAND / NEON WATERPLANT FIELD ARCHIVE</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-media"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <button class="modal-close" id="modalClose">✕</button>
      <span class="modal-cat" id="modalCat"></span>
      <h2 class="modal-name" id="modalName"></h2>
      <p class="modal-blurb" id="modalBlurb"></p>
      <div class="stat-grid" id="modalStats"></div>
    </div>
  </div>
</div>

   "coming soon" tiles.

   FIELDS:
   name      - display name of the animal
   category  - short tag, e.g. "MAMMAL", "DEEP SEA", "NEON WATERPLANT"
   image     - path or URL to your infographic/art image
   blurb     - 1-3 sentence description for the expanded view
   facts     - object of label: value pairs, shows as a stat grid

/* ====================== RENDER LOGIC (no need to touch) ====================== */

const grid = document.getElementById('grid');

function buildCard(specimen, index){
  const num = String(index + 1).padStart(2, '0');
  const card = document.createElement('div');

  if(specimen){
    card.className = 'card ready';
    card.tabIndex = 0;
    card.innerHTML = `
      <span class="tag">${num}</span>
      <img src="${specimen.image}" alt="${specimen.name}" loading="lazy">
      <div class="name-strip">
        <span class="cat">${specimen.category || ''}</span>
        <span class="nm">${specimen.name}</span>
      </div>
    `;
    card.addEventListener('click', () => openModal(specimen));
    card.addEventListener('keydown', e => { if(e.key === 'Enter') openModal(specimen); });
  } else {
    card.className = 'card locked';
    card.innerHTML = `
      <span class="tag">${num}</span>
      <div class="placeholder">
        <div class="num">${num}</div>
        <div class="stamp">Not yet logged</div>
      </div>
    `;
  }
  return card;
}

function render(){
  grid.innerHTML = '';
  for(let i = 0; i < TOTAL_SLOTS; i++){
    grid.appendChild(buildCard(SPECIMENS[i], i));
  }
  document.getElementById('progressCount').textContent = `${SPECIMENS.length} / ${TOTAL_SLOTS}`;
  document.getElementById('progressFill').style.width = `${(SPECIMENS.length / TOTAL_SLOTS) * 100}%`;
}

/* ====================== MODAL ====================== */

const backdrop = document.getElementById('modalBackdrop');
const modalImg = document.getElementById('modalImg');
const modalCat = document.getElementById('modalCat');
const modalName = document.getElementById('modalName');
const modalBlurb = document.getElementById('modalBlurb');
const modalStats = document.getElementById('modalStats');

function openModal(specimen){
  modalImg.src = specimen.image;
  modalImg.alt = specimen.name;
  modalCat.textContent = specimen.category || '';
  modalName.textContent = specimen.name;
  modalBlurb.textContent = specimen.blurb || '';
  modalStats.innerHTML = '';
  Object.entries(specimen.facts || {}).forEach(([k, v]) => {
    const stat = document.createElement('div');
    stat.className = 'stat';
    stat.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
    modalStats.appendChild(stat);
  });
  backdrop.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => backdrop.classList.remove('open'));
backdrop.addEventListener('click', e => { if(e.target === backdrop) backdrop.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') backdrop.classList.remove('open'); });

render();
</script>
